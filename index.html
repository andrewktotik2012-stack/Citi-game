<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>City Destruction Mobile</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#87ceeb; font-family:Arial; touch-action:none; }
  #app { position:fixed; inset:0; }
  #info {
    position:fixed; top:8px; left:8px; color:#fff; z-index:10;
    background:rgba(0,0,0,0.55); padding:6px 10px; border-radius:6px;
    font-size:12px; line-height:1.4;
  }
  #info b { color:#ffd700; }
  #hud {
    position:fixed; bottom:0; left:0; right:0; z-index:10;
    display:flex; justify-content:center; gap:10px;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(0,0,0,0.6), transparent);
  }
  .btn {
    width:72px; height:72px; border-radius:50%;
    background:rgba(255,255,255,0.15);
    border:2px solid rgba(255,255,255,0.4);
    color:#fff; font-size:30px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none;
    backdrop-filter: blur(4px);
    transition: transform 0.1s, background 0.1s;
  }
  .btn:active, .btn.active {
    transform: scale(0.92);
    background: rgba(255,80,80,0.5);
    border-color:#ff6666;
  }
  #crosshair {
    position:fixed; top:50%; left:50%; width:24px; height:24px;
    margin:-12px 0 0 -12px; z-index:5; pointer-events:none;
  }
  #crosshair::before, #crosshair::after {
    content:''; position:absolute; background:rgba(255,255,255,0.85);
    box-shadow:0 0 3px rgba(0,0,0,0.8);
  }
  #crosshair::before { left:11px; top:0; width:2px; height:24px; }
  #crosshair::after  { top:11px; left:0; height:2px; width:24px; }
</style>
</head>
<body>
<div id="app"></div>

<div id="info">
  <b>💣</b> выбери инструмент, потом <b>тапни по цели</b><br>
  Свайп — камера · 2 пальца — зум
</div>

<div id="crosshair"></div>

<div id="hud">
  <div class="btn active" data-mode="bomb">💣</div>
  <div class="btn" data-mode="grenade">✋</div>
  <div class="btn" data-mode="plane">✈️</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ========== НАСТРОЙКИ ПОД ТЕЛЕФОН ==========
const MOBILE_QUALITY = {
  pixelRatio: 0.7,        // пониженное разрешение для FPS
  shadows: false,
  cityRadius: 2,          // кварталов от центра (меньше = быстрее)
  debrisLife: 2.5,
  maxDebris: 60,
  lampLights: false
};

// ---------- Сцена ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 120, 400);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 1500);
camera.position.set(50, 60, 100);

const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE_QUALITY.pixelRatio * 2));
renderer.setSize(innerWidth, innerHeight);
if (MOBILE_QUALITY.shadows) renderer.shadowMap.enabled = true;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI/2.05;
controls.minDistance = 30;
controls.maxDistance = 250;
controls.target.set(0, 5, 0);
// касания
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

// ---------- Свет (без теней) ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3);
sun.position.set(80, 150, 60);
scene.add(sun);

// ---------- Земля и дороги ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(800, 800),
  new THREE.MeshLambertMaterial({ color:0x3a5a3a })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

const roadMat = new THREE.MeshLambertMaterial({ color:0x222222 });
for (let i = -3; i <= 3; i++) {
  const h = new THREE.Mesh(new THREE.PlaneGeometry(280, 8), roadMat);
  h.rotation.x = -Math.PI/2; h.position.set(0, 0.01, i*40);
  scene.add(h);
  const v = new THREE.Mesh(new THREE.PlaneGeometry(8, 280), roadMat);
  v.rotation.x = -Math.PI/2; v.position.set(i*40, 0.01, 0);
  scene.add(v);
}

// ---------- Здания ----------
const buildings = [];
const FLOOR_HEIGHT = 4;
const buildingColors = [0x8899aa, 0xaa9988, 0x99aabb, 0xbbaa99, 0xa0a0a0, 0xc0b8a8];

function createBuilding(x, z, w, d, floors) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  const mat = new THREE.MeshLambertMaterial({
    color: buildingColors[Math.floor(Math.random()*buildingColors.length)]
  });
  const floorMeshes = [];

  for (let i = 0; i < floors; i++) {
    const floor = new THREE.Mesh(new THREE.BoxGeometry(w, FLOOR_HEIGHT, d), mat);
    floor.position.y = i * FLOOR_HEIGHT + FLOOR_HEIGHT/2;
    floor.userData = { building: group, floorIndex: i };
    group.add(floor);
    floorMeshes.push(floor);
  }

  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(w*1.05, 0.6, d*1.05),
    new THREE.MeshLambertMaterial({ color:0x555555 })
  );
  roof.position.y = floors * FLOOR_HEIGHT;
  roof.userData = { building: group, floorIndex: floors };
  group.add(roof);
  floorMeshes.push(roof);

  group.userData = {
    floors, floorHeight: FLOOR_HEIGHT, width: w, depth: d,
    floorMeshes, destroyed: new Set(), alive: true
  };

  scene.add(group);
  buildings.push(group);
}

for (let gx = -MOBILE_QUALITY.cityRadius; gx <= MOBILE_QUALITY.cityRadius; gx++) {
  for (let gz = -MOBILE_QUALITY.cityRadius; gz <= MOBILE_QUALITY.cityRadius; gz++) {
    if (Math.abs(gx) <= 0 && Math.abs(gz) <= 0) continue;
    const cx = gx*40, cz = gz*40;
    for (let i = 0; i < 2; i++) {
      const ox = cx + (Math.random()-0.5)*18;
      const oz = cz + (Math.random()-0.5)*18;
      const w = 8 + Math.random()*6;
      const d = 8 + Math.random()*6;
      const f = 3 + Math.floor(Math.random()*8);
      createBuilding(ox, oz, w, d, f);
    }
    if (Math.random() < 0.3) {
      const ox = cx + (Math.random()-0.5)*18;
      const oz = cz + (Math.random()-0.5)*18;
      createBuilding(ox, oz, 10, 10, 12 + Math.floor(Math.random()*8));
    }
  }
}

// ---------- Фонари ----------
const poleMat = new THREE.MeshLambertMaterial({ color:0x333333 });
const lampMat = new THREE.MeshBasicMaterial({ color:0xffdd55 });
const poleGeo = new THREE.CylinderGeometry(0.3, 0.3, 10);
const headGeo = new THREE.SphereGeometry(0.8);
for (let i = -3; i <= 3; i++) {
  for (const z of [15, -15]) {
    const pole = new THREE.Mesh(poleGeo, poleMat);
    pole.position.set(i*40 + 15, 5, z);
    scene.add(pole);
    const head = new THREE.Mesh(headGeo, lampMat);
    head.position.set(i*40 + 15, 10.3, z);
    scene.add(head);
  }
}

// ---------- Машины ----------
const cars = [];
const carBodyGeo = new THREE.BoxGeometry(2, 1.2, 4);
const carTopGeo = new THREE.BoxGeometry(1.8, 0.9, 2);
const carTopMat = new THREE.MeshLambertMaterial({ color:0x222233 });
for (let i = -3; i <= 3; i++) {
  for (let j = 0; j < 2; j++) {
    const alongRoad = Math.random() < 0.5;
    const x = alongRoad ? i*40 + (Math.random()-0.5)*2 : (Math.random()-0.5)*80;
    const z = alongRoad ? (Math.random()-0.5)*80 : i*40 + (Math.random()-0.5)*2;
    const g = new THREE.Group();
    const body = new THREE.Mesh(carBodyGeo,
      new THREE.MeshLambertMaterial({ color: Math.random()*0xffffff }));
    body.position.y = 1;
    g.add(body);
    const top = new THREE.Mesh(carTopGeo, carTopMat);
    top.position.y = 2;
    g.add(top);
    g.position.set(x, 0, z);
    g.rotation.y = alongRoad ? 0 : Math.PI/2;
    scene.add(g);
    cars.push(g);
  }
}

// ---------- Разрушение ----------
const debris = [];

function destroyFloor(buildingGroup, floorIndex) {
  const data = buildingGroup.userData;
  if (!data.alive) return;

  for (let i = floorIndex; i < data.floorMeshes.length; i++) {
    if (data.destroyed.has(i)) continue;
    data.destroyed.add(i);
    const mesh = data.floorMeshes[i];
    if (!mesh.parent) continue;

    const worldPos = new THREE.Vector3();
    mesh.getWorldPosition(worldPos);
    const bbox = new THREE.Box3().setFromObject(mesh);
    const size = new THREE.Vector3();
    bbox.getSize(size);

    const pieces = 4 + Math.floor(Math.random()*4);
    for (let p = 0; p < pieces; p++) {
      if (debris.length >= MOBILE_QUALITY.maxDebris) {
        const old = debris.shift();
        scene.remove(old.mesh);
      }
      const piece = new THREE.Mesh(
        new THREE.BoxGeometry(
          size.x/3 * (0.5 + Math.random()*0.5),
          size.y/2 * (0.5 + Math.random()*0.5),
          size.z/3 * (0.5 + Math.random()*0.5)
        ),
        mesh.material
      );
      piece.position.copy(worldPos);
      piece.position.x += (Math.random()-0.5) * size.x * 0.8;
      piece.position.y += (Math.random()-0.5) * size.y * 0.8;
      piece.position.z += (Math.random()-0.5) * size.z * 0.8;
      scene.add(piece);
      debris.push({
        mesh: piece,
        vel: new THREE.Vector3(
          (Math.random()-0.5) * 10,
          Math.random() * 6 + 1,
          (Math.random()-0.5) * 10
        ),
        rot: new THREE.Vector3(
          (Math.random()-0.5) * 5,
          (Math.random()-0.5) * 5,
          (Math.random()-0.5) * 5
        ),
        life: MOBILE_QUALITY.debrisLife
      });
    }
    mesh.parent.remove(mesh);
  }

  if (data.destroyed.size >= data.floorMeshes.length) data.alive = false;
}

// ---------- Взрывы ----------
const explosions = [];
const expGeo = new THREE.SphereGeometry(1, 12, 12);

function explode(position, radius, power) {
  const mat = new THREE.MeshBasicMaterial({ color:0xffaa33, transparent:true, opacity:0.9 });
  const sphere = new THREE.Mesh(expGeo, mat);
  sphere.position.copy(position);
  scene.add(sphere);
  explosions.push({ mesh: sphere, life: 0.5, maxLife: 0.5, targetRadius: radius });

  // разрушение зданий
  for (const b of buildings) {
    const data = b.userData;
    if (!data.alive) continue;
    const distXZ = Math.hypot(b.position.x - position.x, b.position.z - position.z);
    if (distXZ > radius + Math.max(data.width, data.depth)) continue;
    const localY = position.y - b.position.y;
    let hitFloor = Math.floor(localY / data.floorHeight);
    hitFloor = Math.max(0, Math.min(hitFloor, data.floors));
    destroyFloor(b, hitFloor);
  }

  // отбрасываем машины
  for (const car of cars) {
    const dx = car.position.x - position.x;
    const dz = car.position.z - position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < radius) {
      const force = (1 - dist/radius) * power;
      car.userData.vel = car.userData.vel || new THREE.Vector3();
      car.userData.vel.x += (dx/(dist||1)) * force;
      car.userData.vel.z += (dz/(dist||1)) * force;
      car.userData.vel.y += force * 0.6;
    }
  }
}

// ---------- Самолёты ----------
const planes = [];
const planeBodyGeo = new THREE.CylinderGeometry(0.8, 0.8, 8, 10);
const planeBodyMat = new THREE.MeshLambertMaterial({ color:0xdddddd });
const planeWingGeo = new THREE.BoxGeometry(10, 0.3, 2);
const planeTailGeo = new THREE.BoxGeometry(1, 2, 0.3);
const planeMat = new THREE.MeshLambertMaterial({ color:0xcccccc });

function launchPlane() {
  const alive = buildings.filter(b => b.userData.alive);
  if (!alive.length) return;
  const target = alive[Math.floor(Math.random()*alive.length)];
  const targetPos = target.position.clone();
  targetPos.y = (target.userData.floors * FLOOR_HEIGHT) / 2;

  const start = targetPos.clone();
  start.x += 180 + Math.random()*80;
  start.y += 50 + Math.random()*30;
  start.z += (Math.random()-0.5) * 80;

  const g = new THREE.Group();
  const body = new THREE.Mesh(planeBodyGeo, planeBodyMat);
  body.rotation.z = Math.PI/2;
  g.add(body);
  const wing = new THREE.Mesh(planeWingGeo, planeMat);
  g.add(wing);
  const tail = new THREE.Mesh(planeTailGeo, planeMat);
  tail.position.set(-4, 1, 0);
  g.add(tail);

  g.position.copy(start);
  g.lookAt(targetPos);
  g.rotateY(Math.PI/2);
  scene.add(g);

  const dir = targetPos.clone().sub(start).normalize();
  planes.push({
    mesh: g, vel: dir.multiplyScalar(85),
    target: targetPos, targetBuilding: target, t: 0
  });
}

// ---------- Тач-управление ----------
let currentMode = 'bomb';
let pointerDownPos = null;
let didMove = false;

document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', e => {
    e.stopPropagation();
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
  });
  btn.addEventListener('touchstart', e => {
    e.stopPropagation();
    btn.classList.add('active');
  }, { passive:true });
  btn.addEventListener('touchend', e => {
    e.stopPropagation();
  }, { passive:true });
});

const raycaster = new THREE.Raycaster();
const tapNDC = new THREE.Vector2();

function screenToWorld(clientX, clientY) {
  tapNDC.x = (clientX / innerWidth) * 2 - 1;
  tapNDC.y = -(clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(tapNDC, camera);
  const targets = [];
  scene.traverse(o => {
    if (o.isMesh && o !== ground && !o.userData.isExplosion && !o.userData.isDebris) {
      targets.push(o);
    }
  });
  const hits = raycaster.intersectObjects(targets, false);
  if (hits.length > 0) return hits[0].point.clone();
  const gHit = raycaster.intersectObject(ground, false);
  if (gHit.length > 0) return gHit[0].point.clone();
  return null;
}

function handleTap(clientX, clientY) {
  if (currentMode === 'plane') {
    launchPlane();
    return;
  }
  const p = screenToWorld(clientX, clientY);
  if (!p) return;
  if (currentMode === 'bomb') explode(p, 20, 22);
  else explode(p, 9, 10);
}

// Различаем тап и свайп
const dom = renderer.domElement;
dom.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    pointerDownPos = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
    didMove = false;
  } else {
    pointerDownPos = null;
  }
}, { passive:true });

dom.addEventListener('touchmove', e => {
  if (pointerDownPos && e.touches.length === 1) {
    const dx = e.touches[0].clientX - pointerDownPos.x;
    const dy = e.touches[0].clientY - pointerDownPos.y;
    if (Math.hypot(dx, dy) > 10) didMove = true;
  }
}, { passive:true });

dom.addEventListener('touchend', e => {
  if (pointerDownPos && !didMove) {
    const dt = Date.now() - pointerDownPos.t;
    if (dt < 400) handleTap(pointerDownPos.x, pointerDownPos.y);
  }
  pointerDownPos = null;
  didMove = false;
}, { passive:true });

// ПК (для отладки)
dom.addEventListener('click', e => {
  if (pointerDownPos === null) handleTap(e.clientX, e.clientY);
});
window.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'b') launchPlane();
});

// ---------- Анимация ----------
const clock = new THREE.Clock();
const tmpVec = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // обломки
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.vel.y -= 22 * dt;
    d.mesh.position.addScaledVector(d.vel, dt);
    if (d.mesh.position.y < 0.3) {
      d.mesh.position.y = 0.3;
      d.vel.y *= -0.25;
      d.vel.x *= 0.7;
      d.vel.z *= 0.7;
    }
    d.mesh.rotation.x += d.rot.x * dt;
    d.mesh.rotation.y += d.rot.y * dt;
    d.mesh.rotation.z += d.rot.z * dt;
    d.life -= dt;
    if (d.life < 0) {
      scene.remove(d.mesh);
      d.mesh.geometry.dispose();
      debris.splice(i, 1);
    }
  }

  // взрывы
  for (let i = explosions.length - 1; i >= 0; i--) {
    const ex = explosions[i];
    ex.life -= dt;
    const k = Math.max(0, ex.life / ex.maxLife);
    const s = ex.targetRadius * (1 - k*k);
    ex.mesh.scale.setScalar(Math.max(0.1, s));
    ex.mesh.material.opacity = k;
    if (ex.life <= 0) {
      scene.remove(ex.mesh);
      ex.mesh.material.dispose();
      explosions.splice(i, 1);
    }
  }

  // машины
  for (const car of cars) {
    const v = car.userData.vel;
    if (!v) continue;
    car.position.addScaledVector(v, dt);
    v.y -= 18 * dt;
    if (car.position.y <= 0) {
      car.position.y = 0;
      v.y *= -0.3;
      v.x *= 0.8;
      v.z *= 0.8;
    }
  }

  // самолёты
  for (let i = planes.length - 1; i >= 0; i--) {
    const p = planes[i];
    p.mesh.position.addScaledVector(p.vel, dt);
    p.t += dt;

    // столкновение
    if (p.mesh.position.distanceTo(p.target) < 6) {
      explode(p.mesh.position, 26, 36);
      const b = p.targetBuilding;
      if (b && b.userData.alive) {
        const data = b.userData;
        const localY = p.mesh.position.y - b.position.y;
        let hf = Math.floor(localY / data.floorHeight);
        hf = Math.max(0, Math.min(hf, data.floors));
        destroyFloor(b, hf);
      }
      // обломки самолёта
      for (let k = 0; k < 12; k++) {
        if (debris.length >= MOBILE_QUALITY.maxDebris) {
          const old = debris.shift();
          scene.remove(old.mesh);
        }
        const piece = new THREE.Mesh(
          new THREE.BoxGeometry(0.5+Math.random(), 0.5+Math.random(), 0.5+Math.random()),
          planeMat
        );
        piece.position.copy(p.mesh.position);
        scene.add(piece);
        debris.push({
          mesh: piece,
          vel: new THREE.Vector3(
            (Math.random()-0.5)*25, Math.random()*18, (Math.random()-0.5)*25
          ),
          rot: new THREE.Vector3(
            (Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10
          ),
          life: MOBILE_QUALITY.debrisLife
        });
      }
      scene.remove(p.mesh);
      planes.splice(i, 1);
    } else if (p.t > 8) {
      scene.remove(p.mesh);
      planes.splice(i, 1);
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
  </html>
