<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>City Destruction</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial;touch-action:none}
#info{position:fixed;top:6px;left:6px;color:#fff;z-index:10;background:rgba(0,0,0,.55);padding:5px 9px;border-radius:6px;font-size:11px;line-height:1.4}
#hud{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(0,0,0,.6),transparent)}
.btn{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;user-select:none}
.btn.active{transform:scale(.92);background:rgba(255,80,80,.5);border-color:#f66}
#pControls{position:fixed;bottom:75px;left:0;right:0;z-index:11;display:none;justify-content:center;gap:10px;padding:0 8px}
#pControls.on{display:flex}
.pbtn{width:52px;height:52px;border-radius:50%;background:rgba(0,100,200,.55);border:2px solid rgba(255,255,255,.6);color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center;user-select:none}
.pbtn:active{background:rgba(0,150,255,.9)}
#exit{position:fixed;top:8px;right:8px;z-index:11;display:none;background:rgba(200,0,0,.75);color:#fff;border:2px solid #fff;border-radius:8px;padding:8px 14px;font-size:13px}
#exit.on{display:block}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20;transition:opacity .3s}
</style>
</head>
<body>
<div id="info"><b>Выбери → тапни по цели</b><br>Свайп — камера · 2 пальца — зум</div>
<div id="flash"></div>
<div id="exit">✕ Выйти из самолёта</div>
<div id="pControls">
<div class="pbtn" id="pL">◄</div>
<div class="pbtn" id="pU">▲</div>
<div class="pbtn" id="pD">▼</div>
<div class="pbtn" id="pR">►</div>
</div>
<div id="hud">
<div class="btn active" data-mode="bomb">💣</div>
<div class="btn" data-mode="grenade">✋</div>
<div class="btn" data-mode="rocket">🚀</div>
<div class="btn" data-mode="plane">✈️</div>
<div class="btn" data-mode="nuke">☢️</div>
</div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,150,600);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,2000);
camera.position.set(50,60,100);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.3));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,1.1));
const sun=new THREE.DirectionalLight(0xffffff,1.3);
sun.position.set(80,150,60);
scene.add(sun);

// ЗЕМЛЯ
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),new THREE.MeshLambertMaterial({color:0x3a5a3a}));
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// ГОРЫ ВОКРУГ ГОРОДА
const mountains=[];
function mkMountain(x,z,r,h){
  const cone=new THREE.Mesh(
    new THREE.ConeGeometry(r,h,8),
    new THREE.MeshLambertMaterial({color:0x667755,flatShading:true})
  );
  cone.position.set(x,h/2,z);
  cone.rotation.y=Math.random()*Math.PI;
  scene.add(cone);mountains.push(cone);
  // снежная шапка
  if(h>25){
    const cap=new THREE.Mesh(
      new THREE.ConeGeometry(r*0.4,h*0.3,8),
      new THREE.MeshLambertMaterial({color:0xffffff,flatShading:true})
    );
    cap.position.set(x,h*0.85,z);
    cap.rotation.y=cone.rotation.y;
    scene.add(cap);
  }
}
// кольцо гор по краям карты (радиус 250-400)
for(let a=0;a<Math.PI*2;a+=Math.PI/16){
  const r=250+Math.random()*130;
  const x=Math.cos(a)*r;
  const z=Math.sin(a)*r;
  const h=15+Math.random()*30;
  const rr=10+Math.random()*15;
  mkMountain(x,z,rr,h);
}
// пара холмов ближе к городу
for(let i=0;i<8;i++){
  const a=Math.random()*Math.PI*2;
  const r=180+Math.random()*40;
  mkMountain(Math.cos(a)*r,Math.sin(a)*r,8+Math.random()*6,8+Math.random()*10);
}

// РЕКА И МОСТ
const riverZ=-90;
const river=new THREE.Mesh(new THREE.PlaneGeometry(1000,30),new THREE.MeshLambertMaterial({color:0x2a6ea8,transparent:true,opacity:.85}));
river.rotation.x=-Math.PI/2;river.position.set(0,.05,riverZ);
scene.add(river);
const bridgeParts=[];
(function mkBridge(){
  const g=new THREE.Group();
  for(let i=-15;i<=15;i+=5){
    const deck=new THREE.Mesh(new THREE.BoxGeometry(10,.8,4.5),new THREE.MeshLambertMaterial({color:0x999999}));
    deck.position.set(0,3,i);g.add(deck);bridgeParts.push(deck);
  }
  for(const z of[-15,-5,5,15]){
    const p=new THREE.Mesh(new THREE.CylinderGeometry(.7,.7,3,8),new THREE.MeshLambertMaterial({color:0x888888}));
    p.position.set(0,1.5,z);g.add(p);
  }
  for(const x of[-4.5,4.5]){
    const r=new THREE.Mesh(new THREE.BoxGeometry(.3,1.5,34),new THREE.MeshLambertMaterial({color:0x666666}));
    r.position.set(x,4.1,0);g.add(r);
  }
  g.position.set(0,0,riverZ);scene.add(g);
})();

// ДОРОГИ — СЕТКА
const roadMat=new THREE.MeshLambertMaterial({color:0x1a1a1a});
const roadPoints=[];
for(let i=-3;i<=3;i++){
  const h=new THREE.Mesh(new THREE.PlaneGeometry(300,8),roadMat);
  h.rotation.x=-Math.PI/2;h.position.set(0,.01,i*40);scene.add(h);
  for(let j=-150;j<=150;j+=10)roadPoints.push({x:j,z:i*40});
  const v=new THREE.Mesh(new THREE.PlaneGeometry(8,300),roadMat);
  v.rotation.x=-Math.PI/2;v.position.set(i*40,.01,0);scene.add(v);
  for(let j=-150;j<=150;j+=10)roadPoints.push({x:i*40,z:j});
}

// ВОРОНКИ
const craters=[];
function addCrater(x,z,radius){
  // воронка — тёмный круг
  const crater=new THREE.Mesh(
    new THREE.CircleGeometry(radius*0.5,16),
    new THREE.MeshBasicMaterial({color:0x1a1008})
  );
  crater.rotation.x=-Math.PI/2;crater.position.set(x,.05,z);
  scene.add(crater);
  // выброшенная земля по краям — серёжки из цилиндров
  const cnt=8;
  for(let i=0;i<cnt;i++){
    const a=(i/cnt)*Math.PI*2;
    const cx=x+Math.cos(a)*radius*0.5;
    const cz=z+Math.sin(a)*radius*0.5;
    const chunk=new THREE.Mesh(
      new THREE.ConeGeometry(1.5+Math.random(),2+Math.random()*2,6),
      new THREE.MeshLambertMaterial({color:0x4a3a2a,flatShading:true})
    );
    chunk.position.set(cx,.5,cz);
    chunk.rotation.y=Math.random()*Math.PI;
    scene.add(chunk);
    craters.push(chunk);
  }
  craters.push(crater);
  // дым из воронки
  for(let i=0;i<3;i++){
    const sm=new THREE.Mesh(smokeGeo,new THREE.MeshBasicMaterial({color:0x555555,transparent:true,opacity:.6}));
    sm.position.set(x+(Math.random()-.5)*3,1,z+(Math.random()-.5)*3);
    sm.scale.setScalar(1.5);scene.add(sm);
    fx.push({mesh:sm,life:6,max:6,targetR:5,type:'smoke',vel:new THREE.Vector3(0,1,0)});
  }
}
function checkCrater(pos,radius){
  for(const p of roadPoints){
    const dd=Math.hypot(p.x-pos.x,p.z-pos.z);
    if(dd<radius*0.5){addCrater(pos.x,pos.z,radius);return;}
  }
}

// ТЕКСТУРА ОКОН
function windowTexture(w,h,color){
  const c=document.createElement('canvas');c.width=128;c.height=128;
  const ctx=c.getContext('2d');
  const cr=(color>>16)&255,cg=(color>>8)&255,cb=color&255;
  ctx.fillStyle=`rgb(${cr},${cg},${cb})`;ctx.fillRect(0,0,128,128);
  const cols=4,rows=4,pad=8;
  const ww=(128-pad*(cols+1))/cols,wh=(128-pad*(rows+1))/rows;
  for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){
    ctx.fillStyle=Math.random()>0.5?'#ffdd88':'#2a3a4a';
    ctx.fillRect(pad+col*(ww+pad),pad+r*(wh+pad),ww,wh);
  }
  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(Math.max(1,Math.round(w/6)),Math.max(1,Math.round(h/4)));
  return tex;
}

// ЗДАНИЯ
const buildings=[],FLOOR_H=4;
const bColors=[0x8899aa,0xaa9988,0x99aabb,0xbbaa99,0xa0a0a0,0xc0b8a8];
function mkB(x,z,w,d,f,isSchool,isHospital){
  const g=new THREE.Group();g.position.set(x,0,z);
  let baseColor=bColors[Math.floor(Math.random()*6)];
  if(isSchool)baseColor=0xddcc88;
  if(isHospital)baseColor=0xeeeeee;
  const fl=[];
  for(let i=0;i<f;i++){
    const tex=windowTexture(w,FLOOR_H,baseColor);
    const m=new THREE.MeshLambertMaterial({map:tex});
    const p=new THREE.Mesh(new THREE.BoxGeometry(w,FLOOR_H,d),m);
    p.position.y=i*FLOOR_H+FLOOR_H/2;p.userData={fi:i};g.add(p);fl.push(p);
  }
  const r=new THREE.Mesh(new THREE.BoxGeometry(w*1.05,.5,d*1.05),new THREE.MeshLambertMaterial({color:0x555555}));
  r.position.y=f*FLOOR_H;r.userData={fi:f};g.add(r);fl.push(r);
  if(isHospital){
    const c1=new THREE.Mesh(new THREE.BoxGeometry(w*.5,.3,.8),new THREE.MeshBasicMaterial({color:0xdd2222}));
    c1.position.y=f*FLOOR_H+.5;g.add(c1);
    const c2=new THREE.Mesh(new THREE.BoxGeometry(.8,.3,d*.5),new THREE.MeshBasicMaterial({color:0xdd2222}));
    c2.position.y=f*FLOOR_H+.5;g.add(c2);
  }
  if(isSchool){
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,6,6),new THREE.MeshLambertMaterial({color:0x666666}));
    pole.position.set(0,f*FLOOR_H+3,0);g.add(pole);
    const flag=new THREE.Mesh(new THREE.BoxGeometry(2,.3,1.2),new THREE.MeshBasicMaterial({color:0xdd2222}));
    flag.position.set(1.2,f*FLOOR_H+5.5,0);g.add(flag);
  }
  g.userData={floors:f,floorMeshes:fl,alive:true,width:w,depth:d,destroyed:new Set()};
  scene.add(g);buildings.push(g);
}
for(let gx=-3;gx<=3;gx++)for(let gz=-3;gz<=3;gz++){
  if(!gx&&!gz)continue;
  const cx=gx*40,cz=gz*40;
  if(Math.abs(cz-riverZ)<22)continue;
  for(let i=0;i<2;i++)mkB(cx+(Math.random()-.5)*18,cz+(Math.random()-.5)*18,8+Math.random()*5,8+Math.random()*5,3+Math.floor(Math.random()*8));
  if(Math.random()<.3)mkB(cx+(Math.random()-.5)*18,cz+(Math.random()-.5)*18,10,10,12+Math.floor(Math.random()*8));
}
mkB(-100,-60,16,14,3,true,false);
mkB(90,80,16,14,3,true,false);
mkB(-120,60,18,16,6,false,true);
mkB(110,-40,18,16,6,false,true);

// ФОНАРИ
const lamps=[],poleMat=new THREE.MeshLambertMaterial({color:0x333333}),lampMat=new THREE.MeshBasicMaterial({color:0xffdd55});
const poleGeo=new THREE.CylinderGeometry(.3,.3,10,6),headGeo=new THREE.SphereGeometry(.8,8,8);
function mkLamp(x,z){
  const g=new THREE.Group();
  const p=new THREE.Mesh(poleGeo,poleMat);p.position.y=5;g.add(p);
  const h=new THREE.Mesh(headGeo,lampMat);h.position.y=10.3;g.add(h);
  g.position.set(x,0,z);
  g.userData={falling:false,vel:new THREE.Vector3(),rot:new THREE.Vector3()};
  scene.add(g);lamps.push(g);
}
for(let i=-3;i<=3;i++)for(const z of[15,-15])mkLamp(i*40+15,z);

// МАШИНЫ
const cars=[],wheelGeo=new THREE.CylinderGeometry(.4,.4,.3,8),wheelMat=new THREE.MeshLambertMaterial({color:0x111111});
const glassMat=new THREE.MeshLambertMaterial({color:0x223344}),lightMat=new THREE.MeshBasicMaterial({color:0xffffaa});
function mkCar(x,z,rot,color){
  const g=new THREE.Group(),col=color!==undefined?color:Math.random()*0xffffff;
  const body=new THREE.Mesh(new THREE.BoxGeometry(2,1,4),new THREE.MeshLambertMaterial({color:col}));
  body.position.y=.9;g.add(body);
  const top=new THREE.Mesh(new THREE.BoxGeometry(1.8,.8,2),glassMat);top.position.y=1.8;g.add(top);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(1.9,.15,2.1),new THREE.MeshLambertMaterial({color:col}));
  roof.position.y=2.25;g.add(roof);
  for(const wx of[-1,1])for(const wz of[-1.3,1.3]){
    const w=new THREE.Mesh(wheelGeo,wheelMat);w.rotation.z=Math.PI/2;w.position.set(wx*.95,.4,wz);g.add(w);
  }
  for(const fx of[-.6,.6]){
    const l=new THREE.Mesh(new THREE.BoxGeometry(.4,.3,.1),lightMat);l.position.set(fx,1,2.05);g.add(l);
  }
  g.position.set(x,0,z);g.rotation.y=rot;
  g.userData={exploded:false,vel:null,bodyColor:col};
  scene.add(g);cars.push(g);
}
for(let i=-3;i<=3;i++)for(let j=0;j<2;j++){
  const along=Math.random()<.5;
  const x=along?i*40+(Math.random()-.5)*2:(Math.random()-.5)*80;
  const z=along?(Math.random()-.5)*80:i*40+(Math.random()-.5)*2;
  if(Math.abs(z-riverZ)<22)continue;
  mkCar(x,z,along?0:Math.PI/2);
}
mkCar(-128,55,0,0xffffff);mkCar(-130,58,0,0xffffff);
mkCar(102,-40,0,0xffffff);mkCar(104,-43,0,0xffffff);

// АЗС
const azs=[],tankMat=new THREE.MeshLambertMaterial({color:0xdd3333}),azsMat=new THREE.MeshLambertMaterial({color:0xeeeeee});
function mkAzs(x,z){
  const g=new THREE.Group();
  const roof=new THREE.Mesh(new THREE.BoxGeometry(14,.5,10),azsMat);roof.position.y=6;g.add(roof);
  for(const cx of[-6,6])for(const cz of[-4,4]){
    const col=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,6,8),azsMat);
    col.position.set(cx,3,cz);g.add(col);
  }
  for(const px of[-3,3]){
    const p=new THREE.Mesh(new THREE.BoxGeometry(1.2,2,.8),new THREE.MeshLambertMaterial({color:0xcccccc}));
    p.position.set(px,1,0);g.add(p);
  }
  for(let i=0;i<3;i++){
    const t=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,4,10),tankMat);
    t.rotation.z=Math.PI/2;t.position.set(-6+i*2,1.2,8);g.add(t);
  }
  g.position.set(x,0,z);g.userData={exploded:false};scene.add(g);azs.push(g);
}
mkAzs(30,60);mkAzs(-80,-30);mkAzs(80,-30);

// АЭРОДРОМ
const airportZ=-150;
const runway=new THREE.Mesh(new THREE.PlaneGeometry(160,16),new THREE.MeshLambertMaterial({color:0x333333}));
runway.rotation.x=-Math.PI/2;runway.position.set(0,.02,airportZ);scene.add(runway);
for(let i=-70;i<=70;i+=10){
  const line=new THREE.Mesh(new THREE.PlaneGeometry(5,.6),new THREE.MeshBasicMaterial({color:0xffffff}));
  line.rotation.x=-Math.PI/2;line.position.set(i,.03,airportZ);scene.add(line);
}
const towerBase=new THREE.Mesh(new THREE.BoxGeometry(4,20,4),new THREE.MeshLambertMaterial({color:0xcccccc}));
towerBase.position.set(25,10,airportZ+14);scene.add(towerBase);
const towerTop=new THREE.Mesh(new THREE.BoxGeometry(6,4,6),new THREE.MeshLambertMaterial({color:0x3366aa}));
towerTop.position.set(25,22,airportZ+14);scene.add(towerTop);
const hangar=new THREE.Mesh(new THREE.BoxGeometry(22,8,14),new THREE.MeshLambertMaterial({color:0x888888}));
hangar.position.set(-55,4,airportZ+16);scene.add(hangar);

// САМОЛЁТЫ НА СТОЯНКЕ
const parkedPlanes=[];
function mkParkedPlane(x,z,rot){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.9,.9,9,12),new THREE.MeshLambertMaterial({color:0xdddddd}));
  body.rotation.z=Math.PI/2;g.add(body);
  const nose=new THREE.Mesh(new THREE.ConeGeometry(.9,2,12),new THREE.MeshLambertMaterial({color:0xdddddd}));
  nose.rotation.z=-Math.PI/2;nose.position.x=5.5;g.add(nose);
  const wing=new THREE.Mesh(new THREE.BoxGeometry(3,.3,14),new THREE.MeshLambertMaterial({color:0xcccccc}));
  wing.position.x=.5;g.add(wing);
  const th=new THREE.Mesh(new THREE.BoxGeometry(2,2.5,.3),new THREE.MeshLambertMaterial({color:0xcccccc}));
  th.position.set(-4,1.3,0);g.add(th);
  g.position.set(x,2.5,z);g.rotation.y=rot;
  g.userData={parked:true,alive:true};
  scene.add(g);parkedPlanes.push(g);
}
mkParkedPlane(-55,airportZ-3,0);
mkParkedPlane(-55,airportZ+6,0);
mkParkedPlane(-55,airportZ+16,0);

// ВЕТРЯКИ
const windmills=[];
function mkWindmill(x,z){
  const g=new THREE.Group();
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.6,.9,30,8),new THREE.MeshLambertMaterial({color:0xeeeeee}));
  pole.position.y=15;g.add(pole);
  const hub=new THREE.Mesh(new THREE.SphereGeometry(1.2,10,10),new THREE.MeshLambertMaterial({color:0xcccccc}));
  hub.position.set(0,30,1);g.add(hub);
  const blades=[];
  for(let i=0;i<3;i++){
    const blade=new THREE.Group();
    const b=new THREE.Mesh(new THREE.BoxGeometry(.6,14,.2),new THREE.MeshLambertMaterial({color:0xf0f0f0}));
    b.position.y=7;blade.add(b);
    blade.rotation.z=(i/3)*Math.PI*2;
    blade.position.set(0,30,1.3);
    g.add(blade);blades.push(blade);
  }
  g.position.set(x,0,z);
  g.userData={blades,falling:false,vel:new THREE.Vector3(),rot:new THREE.Vector3()};
  scene.add(g);windmills.push(g);
}
mkWindmill(-70,airportZ+30);
mkWindmill(-30,airportZ+40);
mkWindmill(30,airportZ+40);
mkWindmill(70,airportZ+30);

// ОБЛОМКИ
const debris=[],MAX_DEB=200;
function spawnDebris(pos,mat,size,force){
  if(debris.length>=MAX_DEB){const o=debris.shift();scene.remove(o.mesh);}
  const p=new THREE.Mesh(new THREE.BoxGeometry(size.x*(.5+Math.random()*.4),size.y*(.5+Math.random()*.4),size.z*(.5+Math.random()*.4)),mat);
  p.position.copy(pos);scene.add(p);
  debris.push({
    mesh:p,
    vel:new THREE.Vector3((Math.random()-.5)*force,Math.random()*force*.7+2,(Math.random()-.5)*force),
    rot:new THREE.Vector3((Math.random()-.5)*6,(Math.random()-.5)*6,(Math.random()-.5)*6),
    life:60
  });
}

// ОБРУШЕНИЕ
const collapseQ=[];
function destroyFloor(b,fi,extra){
  const d=b.userData;if(!d.alive)return;
  const top=d.floorMeshes.length-1;
  const start=Math.max(0,Math.min(fi,top));
  for(let i=top;i>=start;i--){
    if(d.destroyed.has(i))continue;
    collapseQ.push({b,fi:i,time:(top-i)*.1});
  }
}
function processQ(dt){
  for(let i=collapseQ.length-1;i>=0;i--){
    const c=collapseQ[i];c.time-=dt;if(c.time>0)continue;
    const d=c.b.userData,fi=c.fi;
    if(d.destroyed.has(fi)){collapseQ.splice(i,1);continue;}
    const m=d.floorMeshes[fi];
    if(!m||!m.parent){collapseQ.splice(i,1);continue;}
    d.destroyed.add(fi);
    const wp=new THREE.Vector3();m.getWorldPosition(wp);
    const bb=new THREE.Box3().setFromObject(m),sz=new THREE.Vector3();bb.getSize(sz);
    const pc=3+Math.floor(Math.random()*2);
    for(let p=0;p<pc;p++){
      const pos=wp.clone();
      pos.x+=(Math.random()-.5)*sz.x*.7;
      pos.y+=(Math.random()-.5)*sz.y*.5;
      pos.z+=(Math.random()-.5)*sz.z*.7;
      spawnDebris(pos,m.material,new THREE.Vector3(sz.x*.6,sz.y*.6,sz.z*.6),8);
    }
    for(let k=0;k<4;k++){
      const sm=new THREE.Mesh(smokeGeo,new THREE.MeshBasicMaterial({color:0xaaaaaa,transparent:true,opacity:.5}));
      sm.position.copy(wp);
      sm.position.x+=(Math.random()-.5)*sz.x;
      sm.position.z+=(Math.random()-.5)*sz.z;
      sm.scale.setScalar(1.5+Math.random());scene.add(sm);
      fx.push({mesh:sm,life:2.5,max:2.5,targetR:5,type:'smoke',vel:new THREE.Vector3((Math.random()-.5),.5+Math.random()*.5,(Math.random()-.5))});
    }
    m.parent.remove(m);collapseQ.splice(i,1);
    if(d.destroyed.size>=d.floorMeshes.length)d.alive=false;
  }
}

// ВЗРЫВЫ
const fx=[],expGeo=new THREE.SphereGeometry(1,10,10),smokeGeo=new THREE.SphereGeometry(1,6,6);
function explode(pos,radius,power,isNuke){
  const fireColor=isNuke?0xffffee:0xffaa33;
  const m=new THREE.MeshBasicMaterial({color:fireColor,transparent:true,opacity:.95});
  const s=new THREE.Mesh(expGeo,m);s.position.copy(pos);scene.add(s);
  fx.push({mesh:s,life:isNuke?1.2:.5,max:isNuke?1.2:.5,targetR:radius,type:'fireball'});
  const smCount=isNuke?12:5;
  for(let i=0;i<smCount;i++){
    const sm=new THREE.Mesh(smokeGeo,new THREE.MeshBasicMaterial({color:isNuke?0x111111:0x333333,transparent:true,opacity:.6}));
    sm.position.copy(pos);sm.position.x+=(Math.random()-.5)*6;sm.position.y+=Math.random()*4;sm.position.z+=(Math.random()-.5)*6;
    sm.scale.setScalar(2+Math.random()*2);scene.add(sm);
    fx.push({mesh:sm,life:isNuke?5:2.5,max:isNuke?5:2.5,targetR:radius*(isNuke?1:.7),type:'smoke',vel:new THREE.Vector3((Math.random()-.5)*2,1+Math.random()*2,(Math.random()-.5)*2)});
  }
  if(isNuke){
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(radius*.3,radius*.5,radius*1.5,12,1,true),
      new THREE.MeshBasicMaterial({color:0xffddaa,transparent:true,opacity:.7,side:THREE.DoubleSide}));
    stem.position.copy(pos);stem.position.y+=radius*.75;scene.add(stem);
    fx.push({mesh:stem,life:3,max:3,targetR:1,type:'stem'});
    const cap=new THREE.Mesh(expGeo,new THREE.MeshBasicMaterial({color:0xffcc88,transparent:true,opacity:.7}));
    cap.position.copy(pos);cap.position.y+=radius*1.5;scene.add(cap);
    fx.push({mesh:cap,life:3,max:3,targetR:radius*1.5,type:'cap'});
    const fl=document.getElementById('flash');
    fl.style.transition='none';fl.style.opacity='1';
    setTimeout(()=>{fl.style.transition='opacity 1.5s';fl.style.opacity='0';},50);
  }
  const light=new THREE.PointLight(fireColor,isNuke?800:300,radius*6);
  light.position.copy(pos);scene.add(light);
  fx.push({light,life:isNuke?.8:.35,max:isNuke?.8:.35});
  // воронка на дороге
  checkCrater(pos,radius);
  for(const b of buildings){
    const d=b.userData;if(!d.alive)continue;
    const dd=Math.hypot(b.position.x-pos.x,b.position.z-pos.z);
    if(dd>radius+Math.max(d.width,d.depth))continue;
    let hf=pos.y<5?0:Math.floor((pos.y-b.position.y)/FLOOR_H);
    hf=Math.max(0,Math.min(hf,d.floors-1));
    destroyFloor(b,hf);
  }
  for(const pp of parkedPlanes){
    if(!pp.userData.alive)continue;
    const dd=Math.hypot(pp.position.x-pos.x,pp.position.z-pos.z);
    if(dd<radius+5){
      pp.userData.alive=false;
      for(const child of [...pp.children]){
        const cwp=new THREE.Vector3();child.getWorldPosition(cwp);
        for(let k=0;k<3;k++)spawnDebris(cwp,child.material||new THREE.MeshLambertMaterial({color:0xaaaaaa}),new THREE.Vector3(1,1,1),15);
      }
      scene.remove(pp);
    }
  }
  for(const part of bridgeParts){
    if(!part.parent)continue;
    const wp=new THREE.Vector3();part.getWorldPosition(wp);
    const dd=Math.hypot(wp.x-pos.x,wp.z-pos.z);
    if(dd<radius+5){
      for(let p=0;p<8;p++)spawnDebris(wp,part.material,new THREE.Vector3(10,.8,4.5),18);
      part.parent.remove(part);
    }
  }
  for(const a of azs){
    if(a.userData.exploded)continue;
    const dd=Math.hypot(a.position.x-pos.x,a.position.z-pos.z);
    if(dd<radius+6){
      a.userData.exploded=true;
      const ap=a.position.clone();ap.y=2;
      scene.remove(a);
      setTimeout(()=>explode(ap,28,40,false),150);
    }
  }
  for(const lamp of lamps){
    if(lamp.userData.falling)continue;
    const dd=Math.hypot(lamp.position.x-pos.x,lamp.position.z-pos.z);
    if(dd<radius){
      lamp.userData.falling=true;
      const dx=lamp.position.x-pos.x,dz=lamp.position.z-pos.z,dist=Math.hypot(dx,dz)||1;
      const f=(1-dd/radius)*power*.3;
      lamp.userData.vel.set(dx/dist*f,3+Math.random()*2,dz/dist*f);
      lamp.userData.rot.set((Math.random()-.5)*4,(Math.random()-.5)*4,(Math.random()-.5)*4);
    }
  }
  for(const w of windmills){
    if(w.userData.falling)continue;
    const dd=Math.hypot(w.position.x-pos.x,w.position.z-pos.z);
    if(dd<radius+10){
      w.userData.falling=true;
      const dx=w.position.x-pos.x,dz=w.position.z-pos.z,dist=Math.hypot(dx,dz)||1;
      const f=(1-dd/(radius+10))*power*.5;
      w.userData.vel.set(dx/dist*f,3+Math.random()*3,dz/dist*f);
      w.userData.rot.set((Math.random()-.5)*3,(Math.random()-.5)*3,(Math.random()-.5)*3);
      for(const bl of w.userData.blades){
        if(Math.random()<.7){
          const wp=new THREE.Vector3();bl.getWorldPosition(wp);
          const bm=bl.children[0];
          if(bm){
            for(let k=0;k<3;k++)spawnDebris(wp,bm.material,new THREE.Vector3(1,4,.3),15);
            bl.remove(bm);
          }
        }
      }
    }
  }
  for(const car of cars){
    if(car.userData.exploded)continue;
    const dx=car.position.x-pos.x,dz=car.position.z-pos.z,dist=Math.hypot(dx,dz);
    if(dist<radius){
      const f=(1-dist/radius)*power;
      car.userData.vel=car.userData.vel||new THREE.Vector3();
      car.userData.vel.x+=(dx/(dist||1))*f;car.userData.vel.z+=(dz/(dist||1))*f;car.userData.vel.y+=f*.6;
      if(dist<radius*0.7){
        car.userData.exploded=true;
        const cp=car.position.clone();cp.y=1;
        const fs=new THREE.Mesh(expGeo,new THREE.MeshBasicMaterial({color:0xff8833,transparent:true,opacity:.95}));
        fs.position.copy(cp);scene.add(fs);
        fx.push({mesh:fs,life:.8,max:.8,targetR:8,type:'fireball'});
        const cm=new THREE.MeshLambertMaterial({color:car.userData.bodyColor});
        for(let k=0;k<8;k++)spawnDebris(cp,cm,new THREE.Vector3(1,1,1),18);
        scene.remove(car);
      }
    }
  }
}

// РАКЕТЫ
const rockets=[];
function launchRocket(from,to){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,2,8),new THREE.MeshLambertMaterial({color:0xcc3333}));
  body.rotation.x=Math.PI/2;g.add(body);
  const tip=new THREE.Mesh(new THREE.ConeGeometry(.25,.6,8),new THREE.MeshLambertMaterial({color:0x333333}));
  tip.rotation.x=Math.PI/2;tip.position.z=1.3;g.add(tip);
  g.position.copy(from);g.lookAt(to);scene.add(g);
  const dir=to.clone().sub(from).normalize();
  rockets.push({mesh:g,vel:dir.multiplyScalar(70),life:3});
}

// САМОЛЁТ ИГРОКА
let playerPlane=null;
const planeBodyGeo=new THREE.CylinderGeometry(.9,.9,9,12),planeMat=new THREE.MeshLambertMaterial({color:0xdddddd});
const wingMat=new THREE.MeshLambertMaterial({color:0xcccccc}),engMat=new THREE.MeshLambertMaterial({color:0x333333});
function mkPlane(){
  const g=new THREE.Group();
  const b=new THREE.Mesh(planeBodyGeo,planeMat);b.rotation.z=Math.PI/2;g.add(b);
  const n=new THREE.Mesh(new THREE.ConeGeometry(.9,2,12),planeMat);n.rotation.z=-Math.PI/2;n.position.x=5.5;g.add(n);
  const w=new THREE.Mesh(new THREE.BoxGeometry(3,.3,14),wingMat);w.position.x=.5;g.add(w);
  const th=new THREE.Mesh(new THREE.BoxGeometry(2,2.5,.3),wingMat);th.position.set(-4,1.3,0);g.add(th);
  const tv=new THREE.Mesh(new THREE.BoxGeometry(1.5,.3,4),wingMat);tv.position.set(-4,1,0);g.add(tv);
  for(const zz of[-2.5,2.5]){
    const e=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,3,10),engMat);
    e.rotation.z=Math.PI/2;e.position.set(0,-1,zz);g.add(e);
  }
  return g;
}
function launchPlane(){
  const g=mkPlane();
  g.position.set(-75,2.5,airportZ);
  g.rotation.y=Math.PI;
  scene.add(g);
  playerPlane={mesh:g,speed:0,maxSpeed:60,flying:false};
  document.getElementById('pControls').classList.add('on');
  document.getElementById('exit').classList.add('on');
  document.getElementById('hud').style.opacity='.4';
  controls.enabled=false;
}
function updatePlane(dt){
  if(!playerPlane)return;
  const p=playerPlane;
  if(!p.flying){
    p.speed=Math.min(p.maxSpeed,p.speed+22*dt);
    p.mesh.position.x+=p.speed*dt;
    if(p.speed>42&&p.mesh.position.x>20)p.flying=true;
  }else{
    p.speed=Math.min(p.maxSpeed,p.speed+5*dt);
    if(planeInput.left)p.mesh.rotation.y+=1.3*dt;
    if(planeInput.right)p.mesh.rotation.y-=1.3*dt;
    if(planeInput.up)p.mesh.position.y+=27*dt;
    if(planeInput.down)p.mesh.position.y-=27*dt;
    if(p.mesh.position.y<12)p.mesh.position.y=12;
    const fwd=new THREE.Vector3(1,0,0).applyEuler(p.mesh.rotation);
    p.mesh.position.addScaledVector(fwd,p.speed*dt);
  }
  if(Math.random()<.4){
    const sm=new THREE.Mesh(smokeGeo,new THREE.MeshBasicMaterial({color:0x666666,transparent:true,opacity:.5}));
    sm.position.copy(p.mesh.position);sm.position.y-=1;sm.scale.setScalar(.8+Math.random()*.5);scene.add(sm);
    fx.push({mesh:sm,life:1.2,max:1.2,targetR:3,type:'smoke',vel:new THREE.Vector3(0,.5,0)});
  }
  if(p.mesh.position.y<1){explode(p.mesh.position.clone(),25,35,false);scene.remove(p.mesh);playerPlane=null;endPlane();return;}
  for(const b of buildings){
    if(!b.userData.alive)continue;
    const dx=p.mesh.position.x-b.position.x,dz=p.mesh.position.z-b.position.z;
    if(Math.abs(dx)<b.userData.width/2+1.5&&Math.abs(dz)<b.userData.depth/2+1.5){
      if(p.mesh.position.y>b.position.y&&p.mesh.position.y<b.userData.floors*FLOOR_H+2){
        let hf=Math.floor((p.mesh.position.y-b.position.y)/FLOOR_H);
        hf=Math.max(0,Math.min(hf,b.userData.floors-1));
        const hp=p.mesh.position.clone();
        const pm=[planeMat,wingMat,engMat];
        for(let k=0;k<14;k++)spawnDebris(hp,pm[k%3],new THREE.Vector3(1.2,1,1.2),25);
        const fm=new THREE.MeshBasicMaterial({color:0xffaa33,transparent:true,opacity:.95});
        const fs=new THREE.Mesh(expGeo,fm);fs.position.copy(hp);scene.add(fs);
        fx.push({mesh:fs,life:.6,max:.6,targetR:16,type:'fireball'});
        for(let k=0;k<4;k++){
          const sm=new THREE.Mesh(smokeGeo,new THREE.MeshBasicMaterial({color:0x222222,transparent:true,opacity:.7}));
          sm.position.copy(hp);sm.position.x+=(Math.random()-.5)*3;sm.position.y+=(Math.random()-.5)*3;sm.position.z+=(Math.random()-.5)*3;
          sm.scale.setScalar(2);scene.add(sm);
          fx.push({mesh:sm,life:3,max:3,targetR:6,type:'smoke',vel:new THREE.Vector3((Math.random()-.5),1.5,(Math.random()-.5))});
        }
        // ИСПРАВЛЕНО: ломаем hitFloor + ВСЁ выше
        const data=b.userData;
        const top=b.userData.floors-1;
        for(let fi=top;fi>=hf;fi--){
          if(data.destroyed.has(fi))continue;
          collapseQ.push({b,fi,time:(top-fi)*.1});
        }
        scene.remove(p.mesh);playerPlane=null;endPlane();return;
      }
    }
  }
  // столкновение с ветряком
  for(const w of windmills){
    if(w.userData.falling)continue;
    const dd=Math.hypot(p.mesh.position.x-w.position.x,p.mesh.position.z-w.position.z);
    if(dd<5&&p.mesh.position.y>15&&p.mesh.position.y<35){
      w.userData.falling=true;
      const dx=w.position.x-p.mesh.position.x,dz=w.position.z-p.mesh.position.z,dist=Math.hypot(dx,dz)||1;
      w.userData.vel.set(dx/dist*15,5,dz/dist*15);
      w.userData.rot.set((Math.random()-.5)*3,(Math.random()-.5)*3,(Math.random()-.5)*3);
      for(const bl of w.userData.blades){
        const wp=new THREE.Vector3();bl.getWorldPosition(wp);
        const bm=bl.children[0];
        if(bm){
          for(let k=0;k<4;k++)spawnDebris(wp,bm.material,new THREE.Vector3(1,4,.3),20);
          bl.remove(bm);
        }
      }
      const hp=p.mesh.position.clone();
      const pm=[planeMat,wingMat,engMat];
      for(let k=0;k<16;k++)spawnDebris(hp,pm[k%3],new THREE.Vector3(1.2,1,1.2),28);
      const fm=new THREE.MeshBasicMaterial({color:0xffaa33,transparent:true,opacity:.95});
      const fs=new THREE.Mesh(expGeo,fm);fs.position.copy(hp);scene.add(fs);
      fx.push({mesh:fs,life:.7,max:.7,targetR:20,type:'fireball'});
      scene.remove(p.mesh);playerPlane=null;endPlane();return;
    }
  }
  const fwd=new THREE.Vector3(1,0,0).applyEuler(p.mesh.rotation);
  const camOffset=fwd.clone().multiplyScalar(-22);camOffset.y+=8;
  camera.position.copy(p.mesh.position).add(camOffset);
  camera.lookAt(p.mesh.position.clone().addScaledVector(fwd,20));
}

  camera.position.set(50,60,100);
  document.getElementById('pControls').classList.remove('on');

  document.getElementById('hud').style.opacity='1';

// КАМЕРА
let camTheta=Math.PI/4,camPhi=Math.PI/3,camDist=140;
const camTarget=new THREE.Vector3(0,5,0);
const controls={enabled:true,update(){
  if(!this.enabled)return;
  camPhi=Math.max(.2,Math.min(Math.PI/2.05,camPhi));
  camDist=Math.max(30,Math.min(300,camDist));
  camera.position.x=camTarget.x+camDist*Math.sin(camPhi)*Math.cos(camTheta);
  camera.position.y=camTarget.y+camDist*Math.cos(camPhi);
  camera.position.z=camTarget.z+camDist*Math.sin(camPhi)*Math.sin(camTheta);
  camera.lookAt(camTarget);
}};
let touchStart=null,pinchStart=0;
renderer.domElement.addEventListener('touchstart',e=>{
  if(e.touches.length===1){touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now(),moved:false};}
  else if(e.touches.length===2){
    pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    touchStart=null;
  }
},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&touchStart&&controls.enabled){
    const dx=e.touches[0].clientX-touchStart.x,dy=e.touches[0].clientY-touchStart.y;
    if(Math.hypot(dx,dy)>5)touchStart.moved=true;
    camTheta-=dx*.01;camPhi-=dy*.01;
    touchStart.x=e.touches[0].clientX;touchStart.y=e.touches[0].clientY;
  }else if(e.touches.length===2&&pinchStart){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    camDist*=pinchStart/d;pinchStart=d;
  }
},{passive:true});
renderer.domElement.addEventListener('touchend',e=>{
  if(touchStart&&!touchStart.moved&&Date.now()-touchStart.t<400&&!playerPlane)handleTap(touchStart.x,touchStart.y);
  touchStart=null;pinchStart=0;
},{passive:true});

let mode='bomb';
document.querySelectorAll('#hud .btn').forEach(b=>{

    b.classList.add('active');mode=b.dataset.mode;

const raycaster=new THREE.Raycaster(),ndc=new THREE.Vector2();
function aim(x,y){
  ndc.x=(x/innerWidth)*2-1;ndc.y=-(y/innerHeight)*2+1;
  raycaster.setFromCamera(ndc,camera);
  const t=[];scene.traverse(o=>{if(o.isMesh&&o!==ground&&o!==river)t.push(o);});
  const h=raycaster.intersectObjects(t,false);
  if(h.length)return h[0].point.clone();
  const hg=raycaster.intersectObject(ground,false);
  if(hg.length)return hg[0].point.clone();
  return null;
}
function handleTap(x,y){
  if(playerPlane)return;
  const p=aim(x,y);if(!p)return;
  if(mode==='bomb')explode(p,20,22,false);
  else if(mode==='grenade')explode(p,9,10,false);
  else if(mode==='rocket')launchRocket(camera.position.clone(),p);
  else if(mode==='nuke')explode(p,60,60,true);
}

// ЦИКЛ
const cl=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(cl.getDelta(),.05);
  processQ(dt);
  for(let i=debris.length-1;i>=0;i--){
    const d=debris[i];d.vel.y-=22*dt;d.mesh.position.addScaledVector(d.vel,dt);
    if(d.mesh.position.y<.3){d.mesh.position.y=.3;d.vel.y*=-.25;d.vel.x*=.7;d.vel.z*=.7;}
    d.mesh.rotation.x+=d.rot.x*dt;d.mesh.rotation.y+=d.rot.y*dt;d.mesh.rotation.z+=d.rot.z*dt;
    d.life-=dt;
    if(d.life<10){d.mesh.material.transparent=true;d.mesh.material.opacity=Math.max(.1,d.life/10);}
    if(d.life<0){scene.remove(d.mesh);debris.splice(i,1);}
  }
  for(let i=fx.length-1;i>=0;i--){
    const e=fx[i];e.life-=dt;const k=Math.max(0,e.life/e.max);
    if(e.mesh){
      if(e.type==='stem'){e.mesh.material.opacity=.7*k;}
      else{
        const s=e.targetR*(1-k*k);e.mesh.scale.setScalar(Math.max(.1,s));
        e.mesh.material.opacity=k*(e.type==='smoke'?.6:1);
      }
      if(e.vel)e.mesh.position.addScaledVector(e.vel,dt);
      if(e.life<=0){scene.remove(e.mesh);fx.splice(i,1);}
    }else if(e.light){e.light.intensity=(e.max>.5?800:300)*k;if(e.life<=0){scene.remove(e.light);fx.splice(i,1);}}
  }
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];r.mesh.position.addScaledVector(r.vel,dt);r.life-=dt;
    if(Math.random()<.9){
      const sm=new THREE.Mesh(smokeGeo,new THREE.MeshBasicMaterial({color:0xaaaaaa,transparent:true,opacity:.5}));
      sm.position.copy(r.mesh.position);sm.scale.setScalar(.6);scene.add(sm);
      fx.push({mesh:sm,life:.8,max:.8,targetR:1.5,type:'smoke',vel:new THREE.Vector3(0,.3,0)});
    }
    let hit=false;
    for(const b of buildings){
      if(!b.userData.alive)continue;
      const dx=r.mesh.position.x-b.position.x,dz=r.mesh.position.z-b.position.z;
      if(Math.abs(dx)<b.userData.width/2&&Math.abs(dz)<b.userData.depth/2&&r.mesh.position.y>0&&r.mesh.position.y<b.userData.floors*FLOOR_H){hit=true;break;}
    }
    if(r.life<=0||r.mesh.position.y<0||hit){
      explode(r.mesh.position.clone(),15,18,false);
      scene.remove(r.mesh);rockets.splice(i,1);
    }
  }
  for(const car of cars){
    const v=car.userData.vel;if(!v)continue;
    car.position.addScaledVector(v,dt);v.y-=18*dt;
    if(car.position.y<=0){car.position.y=0;v.y*=-.3;v.x*=.8;v.z*=.8;}
  }
  for(const lamp of lamps){
    if(!lamp.userData.falling)continue;
    const v=lamp.userData.vel;v.y-=22*dt;
    lamp.position.addScaledVector(v,dt);
    lamp.rotation.x+=lamp.userData.rot.x*dt;
    lamp.rotation.y+=lamp.userData.rot.y*dt;
    lamp.rotation.z+=lamp.userData.rot.z*dt;
    if(lamp.position.y<0.5){lamp.position.y=0.5;v.y*=-0.2;v.x*=.6;v.z*=.6;}
  }
  for(const w of windmills){
    if(!w.userData.falling){
      for(const bl of w.userData.blades)bl.rotation.z+=0.3*dt;
    }else{
      const v=w.userData.vel;v.y-=20*dt;
      w.position.addScaledVector(v,dt);
      w.rotation.x+=w.userData.rot.x*dt;
      w.rotation.y+=w.userData.rot.y*dt;
      w.rotation.z+=w.userData.rot.z*dt;
      if(w.position.y<.5){w.position.y=.5;v.y*=-.15;v.x*=.5;v.z*=.5;}
    }
  }
  updatePlane(dt);
  controls.update();
  renderer.render(scene,camera);
}
loop();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
