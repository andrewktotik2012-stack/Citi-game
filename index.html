<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>City Destruction</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial;touch-action:none}
#info{position:fixed;top:6px;left:6px;color:#fff;z-index:10;background:rgba(0,0,0,.55);padding:5px 9px;border-radius:6px;font-size:11px;line-height:1.4}
#hud{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(0,0,0,.6),transparent)}
.btn{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;user-select:none;backdrop-filter:blur(4px);transition:transform .1s,background .1s}
.btn.active{transform:scale(.92);background:rgba(255,80,80,.5);border-color:#f66}
#pControls{position:fixed;bottom:80px;left:0;right:0;z-index:10;display:none;justify-content:center;gap:10px;padding:0 8px}
#pControls.on{display:flex}
.pbtn{width:54px;height:54px;border-radius:50%;background:rgba(0,100,200,.55);border:2px solid rgba(255,255,255,.6);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;user-select:none}
.pbtn:active{background:rgba(0,150,255,.9)}
#exit{position:fixed;top:8px;right:8px;z-index:11;display:none;background:rgba(200,0,0,.75);color:#fff;border:2px solid #fff;border-radius:8px;padding:8px 14px;font-size:13px}
#exit.on{display:block}
</style>
</head>
<body>
<div id="info"><b>Выбери инструмент → тапни по цели</b><br>Свайп — камера · 2 пальца — зум</div>
<div id="exit">✕ Выйти из самолёта</div>
<div id="pControls">
<div class="pbtn" id="pL">◄</div>
<div class="pbtn" id="pU">▲</div>
<div class="pbtn" id="pD">▼</div>
<div class="pbtn" id="pR">►</div>
</div>
<div id="hud">
<div class="btn active" data-mode="bomb">💣</div>
<div class="btn" data-mode="grenade">✋</div>
<div class="btn" data-mode="rocket">🚀</div>
<div class="btn" data-mode="plane">✈️</div>
</div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,100,350);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1500);
camera.position.set(50,60,100);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,1.1));
const sun=new THREE.DirectionalLight(0xffffff,1.3);
sun.position.set(80,150,60);
scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(800,800),new THREE.MeshLambertMaterial({color:0x3a5a3a}));
ground.rotation.x=-Math.PI/2;
scene.add(ground);
const roadMat=new THREE.MeshLambertMaterial({color:0x222222});
for(let i=-3;i<=3;i++){
  const h=new THREE.Mesh(new THREE.PlaneGeometry(280,8),roadMat);
  h.rotation.x=-Math.PI/2;h.position.set(0,.01,i*40);scene.add(h);
  const v=new THREE.Mesh(new THREE.PlaneGeometry(8,280),roadMat);
  v.rotation.x=-Math.PI/2;v.position.set(i*40,.01,0);scene.add(v);
}
const buildings=[],FLOOR_H=4,bColors=[0x8899aa,0xaa9988,0x99aabb,0xbbaa99,0xa0a0a0,0xc0b8a8];
function mkB(x,z,w,d,f){
  const g=new THREE.Group();g.position.set(x,0,z);
  const m=new THREE.MeshLambertMaterial({color:bColors[Math.floor(Math.random()*6)]});
  const fl=[];
  for(let i=0;i<f;i++){
    const p=new THREE.Mesh(new THREE.BoxGeometry(w,FLOOR_H,d),m);
    p.position.y=i*FLOOR_H+FLOOR_H/2;p.userData={fi:i};g.add(p);fl.push(p);
  }
  const r=new THREE.Mesh(new THREE.BoxGeometry(w*1.05,.5,d*1.05),new THREE.MeshLambertMaterial({color:0x555555}));
  r.position.y=f*FLOOR_H;r.userData={fi:f};g.add(r);fl.push(r);
  g.userData={floors:f,floorMeshes:fl,alive:true,width:w,depth:d,destroyed:new Set()};
  scene.add(g);buildings.push(g);
}
for(let gx=-2;gx<=2;gx++)for(let gz=-2;gz<=2;gz++){
  if(!gx&&!gz)continue;
  const cx=gx*40,cz=gz*40;
  for(let i=0;i<2;i++){
    mkB(cx+(Math.random()-.5)*18,cz+(Math.random()-.5)*18,8+Math.random()*5,8+Math.random()*5,3+Math.floor(Math.random()*8));
  }
  if(Math.random()<.3)mkB(cx+(Math.random()-.5)*18,cz+(Math.random()-.5)*18,10,10,12+Math.floor(Math.random()*8));
}
const poleMat=new THREE.MeshLambertMaterial({color:0x333333}),lampMat=new THREE.MeshBasicMaterial({color:0xffdd55});
const poleGeo=new THREE.CylinderGeometry(.3,.3,10,6),headGeo=new THREE.SphereGeometry(.8,8,8);
for(let i=-3;i<=3;i++)for(const z of[15,-15]){
  const p=new THREE.Mesh(poleGeo,poleMat);p.position.set(i*40+15,5,z);scene.add(p);
  const h=new THREE.Mesh(headGeo,lampMat);h.position.set(i*40+15,10.3,z);scene.add(h);
}
const cars=[],wheelGeo=new THREE.CylinderGeometry(.4,.4,.3,8),wheelMat=new THREE.MeshLambertMaterial({color:0x111111});
const glassMat=new THREE.MeshLambertMaterial({color:0x223344}),lightMat=new THREE.MeshBasicMaterial({color:0xffffaa});
function mkCar(x,z,rot){
  const g=new THREE.Group(),col=Math.random()*0xffffff;
  const body=new THREE.Mesh(new THREE.BoxGeometry(2,1,4),new THREE.MeshLambertMaterial({color:col}));
  body.position.y=.9;g.add(body);
  const top=new THREE.Mesh(new THREE.BoxGeometry(1.8,.8,2),glassMat);top.position.y=1.8;g.add(top);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(1.9,.15,2.1),new THREE.MeshLambertMaterial({color:col}));
  roof.position.y=2.25;g.add(roof);
  for(const wx of[-1,1])for(const wz of[-1.3,1.3]){
    const w=new THREE.Mesh(wheelGeo,wheelMat);w.rotation.z=Math.PI/2;w.position.set(wx*.95,.4,wz);g.add(w);
  }
  for(const fx of[-.6,.6]){
    const l=new THREE.Mesh(new THREE.BoxGeometry(.4,.3,.1),lightMat);l.position.set(fx,1,2.05);g.add(l);
  }
  g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);cars.push(g);
}
for(let i=-3;i<=3;i++)for(let j=0;j<2;j++){
  const along=Math.random()<.5;
  const x=along?i*40+(Math.random()-.5)*2:(Math.random()-.5)*80;
  const z=along?(Math.random()-.5)*80:i*40+(Math.random()-.5)*2;
  mkCar(x,z,along?0:Math.PI/2);
}
const azs=[],tankMat=new THREE.MeshLambertMaterial({color:0xdd3333}),azsMat=new THREE.MeshLambertMaterial({color:0xeeeeee});
function mkAzs(x,z){
  const g=new THREE.Group();
  const roof=new THREE.Mesh(new THREE.BoxGeometry(14,.5,10),azsMat);roof.position.y=6;g.add(roof);
  for(const cx of[-6,6])for(const cz of[-4,4]){
    const col=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,6,8),azsMat);
    col.position.set(cx,3,cz);g.add(col);
  }
  for(const px of[-3,3]){
    const p=new THREE.Mesh(new THREE.BoxGeometry(1.2,2,.8),new THREE.MeshLambertMaterial({color:0xcccccc}));
    p.position.set(px,1,0);g.add(p);
  }
  for(let i=0;i<3;i++){
    const t=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,4,10),tankMat);
    t.rotation.z=Math.PI/2;t.position.set(-6+i*2,1.2,8);g.add(t);
  }
  g.position.set(x,0,z);g.userData={exploded:false};scene.add(g);azs.push(g);
}
mkAzs(20,40);mkAzs(-60,-20);mkAzs(60,-60);
const debris=[],MAX_DEB=80;
function spawnDebris(pos,mat,size,force){
  if(debris.length>=MAX_DEB){const o=debris.shift();scene.remove(o.mesh);}
  const p=new THREE.Mesh(new THREE.BoxGeometry(size.x*(.4+Math.random()*.5),size.y*(.4+Math.random()*.5),size.z*(.4+Math.random()*.5)),mat);
  p.position.copy(pos);scene.add(p);
  debris.push({mesh:p,vel:new THREE.Vector3((Math.random()-.5)*force,Math.random()*force*.7+2,(Math.random()-.5)*force),rot:new THREE.Vector3((Math.random()-.5)*6,(Math.random()-.5)*6,(Math.random()-.5)*6),life:4});
}
const collapseQ=[];
function destroyFloor(b,fi){
  const d=b.userData;if(!d.alive)return;
  const s=Math.min(fi,d.floorMeshes.length-1);
  for(let i=s;i<d.floorMeshes.length;i++){
    if(d.destroyed.has(i))continue;
    collapseQ.push({b,fi:i,time:(i-s)*.12});
  }
}
function processQ(dt){
  for(let i=collapseQ.length-1;i>=0;i--){
    const c=collapseQ[i];c.time-=dt;if(c.time>0)continue;
    const d=c.b.userData,fi=c.fi;
    if(d.destroyed.has(fi)){collapseQ.splice(i,1);continue;}
    const m=d.floorMeshes[fi];
    if(!m||!m.parent){collapseQ.splice(i,1);continue;}
    d.destroyed.add(fi);
    const wp=new THREE.Vector3();m.getWorldPosition(wp);
    const bb=new THREE.Box3().setFromObject(m),sz=new THREE.Vector3();bb.getSize(sz);
    const pc=5+Math.floor(Math.random()*4);
    for(let p=0;p<pc;p++){
      const pos=wp.clone();
      pos.x+=(Math.random()-.5)*sz.x*.9;pos.y+=(Math.random()-.5)*sz.y*.9;pos.z+=(Math.random()-.5)*sz.z*.9;
      spawnDebris(pos,m.material,sz,12);
    }
    m.parent.remove(m);collapseQ.splice(i,1);
    if(d.destroyed.size>=d.floorMeshes.length)d.alive=false;
  }
}
const fx=[],expGeo=new THREE.SphereGeometry(1,10,10),smokeGeo=new THREE.SphereGeometry(1,6,6);
function explode(pos,radius,power){
  const m=new THREE.MeshBasicMaterial({color:0xffaa33,transparent:true,opacity:.95});
  const s=new THREE.Mesh(expGeo,m);s.position.copy(pos);scene.add(s);
  fx.push({mesh:s,life:.5,max:.5,targetR:radius,type:'fireball'});
  for(let i=0;i<5;i++){
    const sm=new THREE.Mesh(smokeGeo,new THREE.MeshBasicMaterial({color:0x333333,transparent:true,opacity:.6}));
    sm.position.copy(pos);sm.position.x+=(Math.random()-.5)*3;sm.position.y+=Math.random()*2;sm.position.z+=(Math.random()-.5)*3;
    sm.scale.setScalar(1.5+Math.random());scene.add(sm);
    fx.push({mesh:sm,life:2.5,max:2.5,targetR:radius*.7,type:'smoke',vel:new THREE.Vector3((Math.random()-.5)*2,1+Math.random(),(Math.random()-.5)*2)});
  }
  const light=new THREE.PointLight(0xffaa33,300,radius*5);light.position.copy(pos);scene.add(light);
  fx.push({light,life:.35,max:.35});
  for(const b of buildings){
    const d=b.userData;if(!d.alive)continue;
    const dd=Math.hypot(b.position.x-pos.x,b.position.z-pos.z);
    if(dd>radius+Math.max(d.width,d.depth))continue;
    let hf=Math.floor((pos.y-b.position.y)/FLOOR_H);
    hf=Math.max(0,Math.min(hf,d.floors-1));
    destroyFloor(b,hf);
  }
  for(const a of azs){
    if(a.userData.exploded)continue;
    const dd=Math.hypot(a.position.x-pos.x,a.position.z-pos.z);
    if(dd<radius+6){
      a.userData.exploded=true;
      setTimeout(()=>explode(new THREE.Vector3(a.position.x,2,a.position.z),30,45),150);
    }
  }
  for(const car of cars){
    const dx=car.position.x-pos.x,dz=car.position.z-pos.z,dist=Math.hypot(dx,dz);
    if(dist<radius){
      const f=(1-dist/radius)*power;
      car.userData.vel=car.userData.vel||new THREE.Vector3();
      car.userData.vel.x+=(dx/(dist||1))*f;car.userData.vel.z+=(dz/(dist||1))*f;car.userData.vel.y+=f*.6;
    }
  }
}
const rockets=[];
function launchRocket(from,to){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,2,8),new THREE.MeshLambertMaterial({color:0xcc3333}));
  body.rotation.x=Math.PI/2;g.add(body);
  const tip=new THREE.Mesh(new THREE.ConeGeometry(.25,.6,8),new THREE.MeshLambertMaterial({color:0x333333}));
  tip.rotation.x=Math.PI/2;tip.position.z=1.3;g.add(tip);
  g.position.copy(from);g.lookAt(to);scene.add(g);
  const dir=to.clone().sub(from).normalize();
  rockets.push({mesh:g,vel:dir.multiplyScalar(70),life:3});
}
const planes=[];
let playerPlane=null;
const planeBodyGeo=new THREE.CylinderGeometry(.9,.9,9,12),planeMat=new THREE.MeshLambertMaterial({color:0xdddddd});
const wingMat=new THREE.MeshLambertMaterial({color:0xcccccc}),engMat=new THREE.MeshLambertMaterial({color:0x333333});
function mkPlane(){
  const g=new THREE.Group();
  const b=new THREE.Mesh(planeBodyGeo,planeMat);b.rotation.z=Math.PI/2;g.add(b);
  const n=new THREE.Mesh(new THREE.ConeGeometry(.9,2,12),planeMat);n.rotation.z=-Math.PI/2;n.position.x=5.5;g.add(n);
  const w=new THREE.Mesh(new THREE.BoxGeometry(3,.3,14),wingMat);w.position.x=.5;g.add(w);
  const th=new THREE.Mesh(new THREE.BoxGeometry(2,2.5,.3),wingMat);th.position.set(-4,1.3,0);g.add(th);
  const tv=new THREE.Mesh(new THREE.BoxGeometry(1.5,.3,4),wingMat);tv.position.set(-4,1,0);g.add(tv);
  for(const zz of[-2.5,2.5]){
    const e=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,3,10),engMat);
    e.rotation.z=Math.PI/2;e.position.set(0,-1,zz);g.add(e);
  }
  return g;
}
function launchPlane(){
  const alive=buildings.filter(b=>b.userData.alive);
  if(!alive.length)return;
  const t=alive[Math.floor(Math.random()*alive.length)];
  const tp=t.position.clone();tp.y=t.userData.floors*FLOOR_H*.5;
  const g=mkPlane();
  const st=tp.clone();st.x+=200;st.y+=60;st.z+=(Math.random()-.5)*80;
  g.position.copy(st);g.lookAt(tp);g.rotateY(Math.PI/2);scene.add(g);
  playerPlane={mesh:g,speed:50,target:tp,targetBuilding:t};
  document.getElementById('pControls').classList.add('on');
  document.getElementById('exit').classList.add('on');
  document.getElementById('hud').style.opacity='.4';
  controls.enabled=false;
}
function updatePlane(dt){
  if(!playerPlane)return;
  const p=playerPlane;
  if(planeInput.left)p.mesh.rotateZ(-.8*dt);
  if(planeInput.right)p.mesh.rotateZ(.8*dt);
  if(planeInput.up)p.mesh.rotateX(-.6*dt);
  if(planeInput.down)p.mesh.rotateX(.6*dt);
  const fwd=new THREE.Vector3(1,0,0).applyQuaternion(p.mesh.quaternion);
  p.mesh.position.addScaledVector(fwd,p.speed*dt);
  if(Math.random()<.6){
    const sm=new THREE.Mesh(smokeGeo,new THREE.MeshBasicMaterial({color:0x666666,transparent:true,opacity:.5}));
    sm.position.copy(p.mesh.position);sm.position.y-=1;sm.scale.setScalar(.8+Math.random()*.5);scene.add(sm);
    fx.push({mesh:sm,life:1.2,max:1.2,targetR:3,type:'smoke',vel:new THREE.Vector3(0,.5,0)});
  }
  if(p.mesh.position.y<2){explode(p.mesh.position.clone(),30,40);scene.remove(p.mesh);playerPlane=null;endPlane();return;}
  for(const b of buildings){
    if(!b.userData.alive)continue;
    const dx=p.mesh.position.x-b.position.x,dz=p.mesh.position.z-b.position.z;
    if(Math.abs(dx)<b.userData.width/2+2&&Math.abs(dz)<b.userData.depth/2+2){
      if(p.mesh.position.y>b.position.y&&p.mesh.position.y<b.userData.floors*FLOOR_H+2){
        explode(p.mesh.position.clone(),32,45);
        let hf=Math.floor((p.mesh.position.y-b.position.y)/FLOOR_H);
        hf=Math.max(0,Math.min(hf,b.userData.floors-1));
        destroyFloor(b,hf);
        scene.remove(p.mesh);playerPlane=null;endPlane();return;
      }
    }
  }
  const off=new THREE.Vector3(-12,4,0).applyQuaternion(p.mesh.quaternion);
  camera.position.copy(p.mesh.position).add(off);
  camera.lookAt(p.mesh.position);
}
function endPlane(){
  controls.enabled=true;controls.target.set(0,5,0);
  camera.position.set(50,60,100);
  document.getElementById('pControls').classList.remove('on');
  document.getElementById('exit').classList.remove('on');
  document.getElementById('hud').style.opacity='1';
}
const planeInput={left:false,right:false,up:false,down:false};
function bindH(id,k){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();planeInput[k]=true;},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();planeInput[k]=false;},{passive:false});
}
bindH('pL','left');bindH('pR','right');bindH('pU','up');bindH('pD','down');
document.getElementById('exit').addEventListener('click',()=>{
  if(playerPlane){scene.remove(playerPlane.mesh);playerPlane=null;}
  endPlane();
});
let camTheta=Math.PI/4,camPhi=Math.PI/3,camDist=120;
const camTarget=new THREE.Vector3(0,5,0);
const controls={enabled:true,update(){
  if(!this.enabled)return;
  camPhi=Math.max(.2,Math.min(Math.PI/2.05,camPhi));
  camDist=Math.max(30,Math.min(250,camDist));
  camera.position.x=camTarget.x+camDist*Math.sin(camPhi)*Math.cos(camTheta);
  camera.position.y=camTarget.y+camDist*Math.cos(camPhi);
  camera.position.z=camTarget.z+camDist*Math.sin(camPhi)*Math.sin(camTheta);
  camera.lookAt(camTarget);
}};
let touchStart=null,pinchStart=0;
renderer.domElement.addEventListener('touchstart',e=>{
  if(e.touches.length===1){touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now(),moved:false};}
  else if(e.touches.length===2){
    pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    touchStart=null;
  }
},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&touchStart&&controls.enabled){
    const dx=e.touches[0].clientX-touchStart.x,dy=e.touches[0].clientY-touchStart.y;
    if(Math.hypot(dx,dy)>5)touchStart.moved=true;
    camTheta-=dx*.01;camPhi-=dy*.01;
    touchStart.x=e.touches[0].clientX;touchStart.y=e.touches[0].clientY;
  }else if(e.touches.length===2&&pinchStart){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    camDist*=pinchStart/d;pinchStart=d;
  }
},{passive:true});
renderer.domElement.addEventListener('touchend',e=>{
  if(touchStart&&!touchStart.moved&&Date.now()-touchStart.t<400&&!playerPlane)handleTap(touchStart.x,touchStart.y);
  touchStart=null;pinchStart=0;
},{passive:true});
let mode='bomb';
document.querySelectorAll('#hud .btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#hud .btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');mode=b.dataset.mode;
    if(mode==='plane')launchPlane();
  });
});
const raycaster=new THREE.Raycaster(),ndc=new THREE.Vector2();
function aim(x,y){
  ndc.x=(x/innerWidth)*2-1;ndc.y=-(y/innerHeight)*2+1;
  raycaster.setFromCamera(ndc,camera);
  const t=[];scene.traverse(o=>{if(o.isMesh&&o!==ground)t.push(o);});
  const h=raycaster.intersectObjects(t,false);
  if(h.length)return h[0].point.clone();
  const hg=raycaster.intersectObject(ground,false);
  if(hg.length)return hg[0].point.clone();
  return null;
}
function handleTap(x,y){
  const p=aim(x,y);if(!p)return;
  if(mode==='bomb')explode(p,20,22);
  else if(mode==='grenade')explode(p,9,10);
  else if(mode==='rocket'){
    const start=camera.position.clone();
    launchRocket(start,p);
  }
}
const cl=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(cl.getDelta(),.05);
  processQ(dt);
  for(let i=debris.length-1;i>=0;i--){
    const d=debris[i];d.vel.y-=22*dt;d.mesh.position.addScaledVector(d.vel,dt);
    if(d.mesh.position.y<.3){d.mesh.position.y=.3;d.vel.y*=-.25;d.vel.x*=.7;d.vel.z*=.7;}
    d.mesh.rotation.x+=d.rot.x*dt;d.mesh.rotation.y+=d.rot.y*dt;d.mesh.rotation.z+=d.rot.z*dt;
    d.life-=dt;if(d.life<0){scene.remove(d.mesh);debris.splice(i,1);}
  }
  for(let i=fx.length-1;i>=0;i--){
    const e=fx[i];e.life-=dt;const k=Math.max(0,e.life/e.max);
    if(e.mesh){
      const s=e.targetR*(1-k*k);e.mesh.scale.setScalar(Math.max(.1,s));
      e.mesh.material.opacity=k*(e.type==='smoke'?.6:1);
      if(e.vel)e.mesh.position.addScaledVector(e.vel,dt);
      if(e.life<=0){scene.remove(e.mesh);fx.splice(i,1);}
    }else if(e.light){e.light.intensity=300*k;if(e.life<=0){scene.remove(e.light);fx.splice(i,1);}}
  }
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];r.mesh.position.addScaledVector(r.vel,dt);r.life-=dt;
    if(Math.random()<.9){
      const sm=new THREE.Mesh(smokeGeo,new THREE.MeshBasicMaterial({color:0xaaaaaa,transparent:true,opacity:.5}));
      sm.position.copy(r.mesh.position);sm.scale.setScalar(.6);scene.add(sm);
      fx.push({mesh:sm,life:.8,max:.8,targetR:1.5,type:'smoke',vel:new THREE.Vector3(0,.3,0)});
    }
    let hit=false;
    for(const b of buildings){
      if(!b.userData.alive)continue;
      const dx=r.mesh.position.x-b.position.x,dz=r.mesh.position.z-b.position.z;
      if(Math.abs(dx)<b.userData.width/2&&Math.abs(dz)<b.userData.depth/2&&r.mesh.position.y>0&&r.mesh.position.y<b.userData.floors*FLOOR_H){hit=true;break;}
    }
    if(r.life<=0||r.mesh.position.y<0||hit){
      explode(r.mesh.position.clone(),18,20);
      scene.remove(r.mesh);rockets.splice(i,1);
    }
  }
  for(const car of cars){
    const v=car.userData.vel;if(!v)continue;
    car.position.addScaledVector(v,dt);v.y-=18*dt;
    if(car.position.y<=0){car.position.y=0;v.y*=-.3;v.x*=.8;v.z*=.8;}
  }
  updatePlane(dt);
  controls.update();
  renderer.render(scene,camera);
}
loop();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
